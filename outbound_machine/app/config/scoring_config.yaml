# ============================================================
# Prodigi Lead Scoring Configuration — Additive Points Model
# ============================================================
# scoring_method: additive
#   Each signal contributes explicit points. No averaging.
#   Multiple findings compound. Severity is differentiated.
#   Total max = 100 (25 ICP + 45 imagery + 20 commercial + 10 outreach).
#
# To adjust: change `points` values directly. No code changes needed.

scoring_method: additive

segments:
  A: 80   # top priority — strong ICP + clear pain + mock angle
  B: 60   # worth working — real issues, some ICP signals
  C: 40   # marginal — weak pain or weak ICP fit
  # D = below 40

categories:

  # ---- ICP Fit (max 25 pts) --------------------------------
  # Is this brand worth pursuing at all?
  icp_fit:
    max: 25
    inputs:
      shopify_confirmed:
        threshold: 0.7          # confident Shopify detection
        points: 8
        partial_threshold: 0.4  # possible Shopify
        partial_points: 4
      sku_fit:
        # 20–200 SKUs is our sweet spot
        buckets:
          under_20: 2
          "20_50": 7
          "50_100": 10
          "100_200": 10
          "200_plus": 4
          unknown: 1
      preferred_vertical:
        preferred:
          - apparel
          - accessories
          - beauty
          - footwear
          - homewares
          - jewelry
          - jewellery
          - skincare
          - cosmetics
        points: 7
        other_points: 2
      contact_available:
        points: 2   # bonus — doesn't block ICP score

  # ---- Imagery Opportunity (max 45 pts) --------------------
  # How severe and how broad is the imagery pain?
  # HIGH findings = commercially critical issues (variants, low count)
  # MEDIUM findings = meaningful but not conversion-blocking
  # Breadth bonus rewards catalogues with multiple compounding issues
  imagery_opportunity:
    max: 45
    per_severity:
      high: 12    # per HIGH finding
      medium: 6   # per MEDIUM finding
      low: 2      # per LOW finding
    breadth_bonus:
      min_findings: 3   # 3+ distinct findings triggers bonus
      points: 5

  # ---- Commercial Potential (max 20 pts) -------------------
  # How clear and large is the business opportunity?
  # Mock opportunity is a PRIMARY signal — must be set before scoring.
  commercial_potential:
    max: 20
    inputs:
      mock_opportunity:
        points: 10   # largest single commercial signal
      variant_complexity:
        high_threshold: 4    # avg variants > 4: high complexity
        high_points: 5
        medium_threshold: 2  # avg variants > 2: moderate complexity
        medium_points: 3
      catalogue_depth_risk:
        points: 5    # thin imagery across a large catalogue = scale pain

  # ---- Outreach Viability (max 10 pts) ---------------------
  # How reachable and warm is the outbound angle?
  outreach_viability:
    max: 10
    inputs:
      has_contact_info:
        points: 7   # direct contact = strong viability signal
      social_presence:
        points: 3
