[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outbound-machine"
version = "0.1.0"
description = "Prodigi outbound lead generation machine for Shopify e-commerce brands"
requires-python = ">=3.11"
dependencies = [
    # HTTP & scraping
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.44.0",
    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    # CLI
    "click>=8.1.7",
    "rich>=13.7.0",
    # Templates
    "jinja2>=3.1.4",
    # CSV / export
    "pandas>=2.2.0",
    # Utilities
    "tenacity>=8.3.0",
    "tqdm>=4.66.0",
    "Pillow>=10.3.0",
    # Optional LLM
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    # Web dashboard
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "httpx",
    "respx>=0.21.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
]

[project.scripts]
outbound = "app.cli.commands:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
